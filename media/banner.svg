<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- szafa serwerowa -->
  <g transform="translate(70 52)">
    <rect width="200" height="216" rx="12" fill="#111827" stroke="#334155" stroke-width="2"/>
    <g fill="#1f2937" stroke="#334155">
      <rect x="16" y="18" width="168" height="38" rx="5"/>
      <rect x="16" y="66" width="168" height="38" rx="5"/>
      <rect x="16" y="114" width="168" height="38" rx="5"/>
      <rect x="16" y="162" width="168" height="38" rx="5"/>
    </g>
    <g fill="#0b1220">
      <rect x="28" y="29" width="96" height="16" rx="2"/>
      <rect x="28" y="77" width="96" height="16" rx="2"/>
      <rect x="28" y="125" width="96" height="16" rx="2"/>
      <rect x="28" y="173" width="96" height="16" rx="2"/>
    </g>
    <g>
      <circle cx="148" cy="37" r="5" fill="#22c55e"/><circle cx="166" cy="37" r="5" fill="#38bdf8"/>
      <circle cx="148" cy="85" r="5" fill="#22c55e"/><circle cx="166" cy="85" r="5" fill="#a78bfa"/>
      <circle cx="148" cy="133" r="5" fill="#22c55e"/><circle cx="166" cy="133" r="5" fill="#f59e0b"/>
      <circle cx="148" cy="181" r="5" fill="#22c55e"/><circle cx="166" cy="181" r="5" fill="#38bdf8"/>
    </g>
    <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2">
      <line x1="34" y1="37" x2="118" y2="37"/><line x1="34" y1="85" x2="100" y2="85"/>
      <line x1="34" y1="133" x2="110" y2="133"/><line x1="34" y1="181" x2="90" y2="181"/>
    </g>
  </g>

  <!-- tytuł -->
  <text x="320" y="128" font-size="58" font-weight="700" fill="#f8fafc">Home Lab Cheat Sheets</text>
  <rect x="322" y="146" width="320" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="320" y="190" font-size="22" fill="#94a3b8">Proxmox · Docker · Linux · Tailscale · PowerShell · Windows</text>

  <!-- kategorie -->
  <g font-size="17" font-weight="600">
    <g transform="translate(320 222)">
      <rect width="104" height="38" rx="19" fill="#e57000" fill-opacity="0.18" stroke="#e57000" stroke-opacity="0.6"/>
      <text x="52" y="25" text-anchor="middle" fill="#fdba74">Proxmox</text>
    </g>
    <g transform="translate(436 222)">
      <rect width="96" height="38" rx="19" fill="#2496ed" fill-opacity="0.18" stroke="#2496ed" stroke-opacity="0.6"/>
      <text x="48" y="25" text-anchor="middle" fill="#93c5fd">Docker</text>
    </g>
    <g transform="translate(544 222)">
      <rect width="84" height="38" rx="19" fill="#facc15" fill-opacity="0.14" stroke="#facc15" stroke-opacity="0.55"/>
      <text x="42" y="25" text-anchor="middle" fill="#fde68a">Linux</text>
    </g>
    <g transform="translate(640 222)">
      <rect width="124" height="38" rx="19" fill="#5391fe" fill-opacity="0.16" stroke="#5391fe" stroke-opacity="0.6"/>
      <text x="62" y="25" text-anchor="middle" fill="#bfdbfe">PowerShell</text>
    </g>
    <g transform="translate(776 222)">
      <rect width="108" height="38" rx="19" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="54" y="25" text-anchor="middle" fill="#a5f3fc">Windows</text>
    </g>
  </g>

  <text x="1160" y="296" font-size="15" fill="#64748b" text-anchor="end">learning by breaking things and fixing them again</text>
</svg>
